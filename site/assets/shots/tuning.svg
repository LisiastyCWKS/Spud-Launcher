<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Panel strojenia sprzętowego: rdzenie, pamięć i wygenerowane flagi JVM">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a120c"/>
      <stop offset="100%" stop-color="#08130f"/>
    </linearGradient>
    <linearGradient id="codeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070d09"/>
      <stop offset="100%" stop-color="#050a07"/>
    </linearGradient>
    <radialGradient id="glowT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8ce74c" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#8ce74c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#tbg)"/>
  <ellipse cx="760" cy="120" rx="420" ry="300" fill="url(#glowT)"/>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="48" y="66" fill="#7f9a84" font-size="10.5" letter-spacing="2.2">HARDWARE</text>
    <text x="48" y="98" fill="#eaf6e4" font-size="26" font-weight="650" letter-spacing="-.02em">Strojenie pod ten komputer</text>
    <text x="48" y="124" fill="#9ab29c" font-size="13">Launcher czyta sprzęt i liczy flagi sam — nie trzeba nic wpisywać.</text>
  </g>

  <g>
    <rect x="48" y="150" width="408" height="176" rx="14" fill="#0c1510" stroke="#1e2f22" stroke-width="1.4"/>
    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="12">
      <text x="70" y="180" fill="#7f9a84" letter-spacing="1.2">CPU</text>
      <text x="434" y="180" fill="#d7ead2" text-anchor="end">8 rdzeni / 16 wątków</text>
      <text x="70" y="216" fill="#7f9a84" letter-spacing="1.2">RAM</text>
      <text x="434" y="216" fill="#d7ead2" text-anchor="end">16 GB · 3200 MHz</text>
      <text x="70" y="252" fill="#7f9a84" letter-spacing="1.2">GPU</text>
      <text x="434" y="252" fill="#d7ead2" text-anchor="end">dGPU · 8 GB</text>
      <text x="70" y="288" fill="#7f9a84" letter-spacing="1.2">DYSK</text>
      <text x="434" y="288" fill="#d7ead2" text-anchor="end">NVMe · 2 TB</text>
    </g>
    <g fill="#8ce74c">
      <rect x="70" y="300" width="34" height="6" rx="3"/>
      <rect x="110" y="300" width="34" height="6" rx="3"/>
      <rect x="150" y="300" width="34" height="6" rx="3"/>
      <rect x="190" y="300" width="34" height="6" rx="3" fill="#2a3f2c"/>
      <rect x="230" y="300" width="34" height="6" rx="3" fill="#2a3f2c"/>
    </g>
  </g>

  <g>
    <rect x="480" y="150" width="432" height="284" rx="14" fill="url(#codeBg)" stroke="#1e2f22" stroke-width="1.4"/>
    <rect x="480" y="150" width="432" height="34" rx="14" fill="#8ce74c" opacity=".07"/>

    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="11.5">
      <text x="502" y="173" fill="#8ce74c" letter-spacing="1.4">JVM FLAGS</text>
      <text x="890" y="173" fill="#6f8a72" text-anchor="end">auto</text>

      <g fill="#b9d4b4">
        <text x="502" y="208">-Xms3G -Xmx6G</text>
        <text x="502" y="234" fill="#8ce74c">-XX:+UseG1GC</text>
        <text x="502" y="260">-XX:+ParallelRefProcEnabled</text>
        <text x="502" y="286">-XX:MaxGCPauseMillis=200</text>
        <text x="502" y="312">-XX:G1NewSizePercent=30</text>
        <text x="502" y="338">-XX:G1HeapRegionSize=8M</text>
        <text x="502" y="364">-XX:+AlwaysPreTouch</text>
      </g>
      <text x="502" y="396" fill="#5d7a62">-Xmx = połowa RAM, sufit 12 GB, iGPU −512 MB</text>
    </g>
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <rect x="48" y="350" width="408" height="84" rx="14" fill="#0c1510" stroke="#1e2f22" stroke-width="1.4"/>
    <text x="70" y="380" fill="#eaf6e4" font-size="13.5" font-weight="620">Pamięć instancji</text>
    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="11">
      <text x="70" y="406" fill="#7f9a84">-Xmx</text>
      <text x="434" y="406" fill="#8ce74c" text-anchor="end">6144 MB</text>
    </g>
    <rect x="70" y="414" width="364" height="7" rx="3.5" fill="#16241a"/>
    <rect x="70" y="414" width="182" height="7" rx="3.5" fill="#8ce74c"/>
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <rect x="48" y="454" width="864" height="52" rx="14" fill="#8ce74c" opacity=".06"/>
    <text x="70" y="486" fill="#b6ff6e" font-size="12.5" letter-spacing=".4">Zestaw optymalizacyjny gotowy · Sodium, Lithium, FerriteCore, Iris</text>
    <text x="890" y="486" fill="#7f9a84" font-size="12" text-anchor="end">10 plików</text>
  </g>
</svg>
